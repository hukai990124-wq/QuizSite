<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sir.Gavin · 你的骑士导师</title>
  <link rel="stylesheet" href="/assets/quizsite-theme.css">
  <link rel="stylesheet" href="/assets/sir-gavin.css">
  <link id="qb-sigil-footer-font" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap">
  <script src="/assets/quizsite-theme.js" id="quizsite-theme-js" defer></script>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/"}}
  </script>
  <script type="module" src="/assets/sir-gavin.mjs"></script>
  <script type="module" src="/assets/gavin-chat.mjs"></script>
</head>
<body>
  <main class="gavin-interface">
    <nav><a href="/">← 返回题库首页</a><button id="contact-author" type="button" aria-haspopup="dialog" aria-controls="contact-author-dialog">联系作者</button></nav>
    <dialog id="contact-author-dialog" aria-labelledby="contact-author-title">
      <div class="contact-heading"><h2 id="contact-author-title">联系作者</h2><button id="contact-author-close" type="button" aria-label="关闭联系作者窗口">×</button></div>
      <p>通过 GitHub 联系作者：</p>
      <a href="https://github.com/hukai990124-wq" target="_blank" rel="noopener noreferrer">github.com/hukai990124-wq</a>
    </dialog>
    <div class="gavin-languages i18n-noloc" role="group" aria-label="Language / 语言 / 言語">
      <button type="button" data-set-lang="zh" aria-pressed="true">中文</button>
      <button type="button" data-set-lang="ja" aria-pressed="false">日本語</button>
      <button type="button" data-set-lang="en" aria-pressed="false">English</button>
    </div>
    <section class="page-section" aria-labelledby="pet-title">
      <div class="pet-heading"><div><p class="pet-kicker">你的骑士导师</p><h1 id="pet-title" class="gavin-name i18n-noloc">Sir.Gavin</h1></div><p>你的骑士导师 · 欧洲历史</p></div>
      <div id="pet" aria-label="Sir.Gavin 互动三维模型"></div>
      <p class="interaction-hint">拖动旋转 · 右键拖动平移 · 滚轮缩放</p>
      <div class="pet-footer">
        <audio id="sir-gavin-handshake-voice" src="./media/sir-gavin-handshake.wav" preload="none"></audio>
        <button id="shake-hands" type="button" disabled>握手</button>
        <button id="reset-view" type="button" disabled>重置视角</button>
        <p id="pet-message" role="status">正在加载 Sir.Gavin…</p>
      </div>
      <noscript>请启用 JavaScript 以显示 Sir.Gavin 的三维模型。</noscript>
      <section class="chat-panel" aria-labelledby="chat-title">
        <h2 id="chat-title"><span class="i18n-noloc">Sir.Gavin</span> · <span>骑士导师对话</span></h2>
        <label class="gavin-model-label" for="gavin-model"><span>选择语言模型</span>
          <select id="gavin-model">
            <option value="cloudflare" selected>Cloudflare · Llama 3.1 8B FP8</option>
            <option value="nvidia">NVIDIA · Nemotron 3.5 Lightning</option>
          </select>
        </label>
        <div class="chat-window" id="gavin-log" role="log" aria-label="与 GavinAI 的对话" aria-live="polite"><p class="gavin-placeholder">向骑士导师提问欧洲历史。</p></div>
        <form class="chat-composer" id="gavin-form"><input id="gavin-input" aria-label="发送给 Sir.Gavin 的消息" placeholder="向骑士导师提问…" maxlength="2000" required disabled><button id="gavin-send" type="submit" disabled>发送问题</button></form>
        <p id="gavin-status" role="status">正在连接 GavinAI…</p>
        <div><button id="gavin-retry" type="button">重新连接</button></div>
      </section>
    </section>
  </main>
  <script src="/assets/i18n.js"></script>
  <script>window.__I18N__.boot();</script>
</body>
</html>
