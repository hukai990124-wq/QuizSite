<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>随机出题 · 题库</title>
  <style>
    body{margin:0;background:#f5f6f8;color:#1f2937;font:16px/1.6 -apple-system,"Segoe UI","PingFang SC",sans-serif}
    main{max-width:560px;margin:12vh auto;padding:24px;background:#fff;border:1px solid #dfe5e8;border-radius:12px}
    h1{font-size:22px;margin:0 0 10px}p{margin:0 0 12px}button{font:inherit;padding:8px 16px;border:1px solid #0b6b3a;border-radius:7px;background:#0b6b3a;color:#fff;cursor:pointer}
  </style>
</head>
<body>
  <main role="status" aria-live="polite"><h1>正在随机出题</h1><p id="message">正在读取题库，请稍候…</p><button id="retry" type="button" hidden>重试</button></main>
  <script src="assets/random-quiz.js"></script>
</body>
</html>
